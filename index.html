<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Interactive design prototype of NextStep, a Senior High School to College to Career roadmap. Sample data only.">
    <meta name="theme-color" content="#0551A0">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NextStep">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* NextStep — design tokens
     ink: school-uniform navy   sky: the deck's light blue   sun: jeepney-route yellow
     leaf: finished-step green  road: the roadmap trail */
  :root {
    --ink: #0B2E5C;
    --ink-2: #0551A0;
    --sky: #D9EAF7;
    --sky-2: #EDF5FB;
    --paper: #F7FAFD;
    --surface: #FFFFFF;
    --line: #CFDDEA;
    --muted: #5A6B84;
    --sun: #F2B705;
    --sun-soft: #FFF3C4;
    --leaf: #238A25;
    --leaf-soft: #DDF3E7;
    --warn: #B4540A;
    --warn-soft: #FDEBD8;
    --road: #0551A0;
    --focus: #2B6CD6;
    --radius-lg: 18px;
    --radius: 12px;
    --radius-sm: 8px;
    --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E6EEF8;
      --ink-2: #B8CBE4;
      --sky: #1D3354;
      --sky-2: #172A45;
      --paper: #0F1D33;
      --surface: #15243D;
      --line: #2A3F60;
      --muted: #9DB0CA;
      --sun: #F5C431;
      --sun-soft: #3A3218;
      --leaf: #4CC04A;
      --leaf-soft: #173A2B;
      --warn: #F0A15E;
      --warn-soft: #3B2716;
      --road: #2E4C78;
      --focus: #7FB0FF;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
  h1 { font-size: clamp(1.7rem, 3.2vw, 2.3rem); font-weight: 800; }
  h2 { font-size: 1.25rem; font-weight: 700; }
  h3 { font-size: 1.05rem; font-weight: 700; }
  p { margin: 0 0 .8em; }
  a { color: var(--ink-2); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Boot */
  .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted); }
  .boot-mark { width: 44px; height: 44px; border-radius: 50%; border: 5px solid var(--sky); border-top-color: var(--sun); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Buttons & forms */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 10px 16px; border-radius: 999px; font-weight: 600; cursor: pointer; text-decoration: none;
    min-height: 44px; transition: background .15s, border-color .15s;
  }
  .btn:hover { border-color: var(--ink-2); }
  .btn.primary { background: #0551A0; border-color: #0551A0; color: #fff; }
  .btn.primary:hover { background: #04427F; }
  @media (prefers-color-scheme: dark) {
    .btn.primary { background: var(--sun); border-color: var(--sun); color: #0551A0; }
    .btn.primary:hover { background: #FFD24D; }
  }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
  .btn.danger { color: #B42318; }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field > span { font-weight: 600; font-size: .93rem; }
  .field .hint { font-size: .84rem; color: var(--muted); font-weight: 400; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=url], input[type=date], input[type=search], select, textarea {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    background: var(--surface); min-height: 44px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
  .form-grid .span-2 { grid-column: 1 / -1; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--leaf); flex: none; }
  .form-msg { min-height: 1.4em; color: #B42318; font-size: .92rem; margin: 8px 0 0; }
  fieldset { border: 0; padding: 0; margin: 0; }

  /* Auth */
  .auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
  .auth-intro { background: #FFFFFF; color: #0B2E5C; padding: clamp(24px, 5vw, 64px); display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--line); }
  .auth-logo { width: min(340px, 80%); height: auto; display: block; margin: 0 0 8px -8px; }
  .auth-intro p { max-width: 46ch; color: #3E5578; font-size: 1.05rem; }
  .auth-route { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 0; position: relative; }
  .auth-route li { position: relative; padding: 0 0 20px 40px; font-weight: 700; color: #0B2E5C; }
  .auth-route li::before { content: ""; position: absolute; left: 7px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid #35AB31; }
  .auth-route li:not(:last-child)::after { content: ""; position: absolute; left: 14px; top: 24px; bottom: 2px; width: 3px; background: repeating-linear-gradient(to bottom, #F2B705 0 6px, transparent 6px 12px); }
  .auth-route small { display: block; font-weight: 400; color: #5A6B84; }
  .auth-card-wrap { display: grid; place-items: center; padding: 32px 20px; }
  .auth-card { width: min(420px, 100%); }



  /* ---------- Grades and household ---------- */
  .formsec { grid-column: 1 / -1; margin: 18px 0 4px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 1.05rem; }
  .gsum { background: var(--sky-2); border-radius: var(--radius-sm); padding: 10px 14px; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
  .gsum strong { font-family: var(--display); font-size: 1.35rem; font-weight: 800; line-height: 1.1; }
  .gsum.empty-mini { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--ink-2); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
  .dropzone { border: 2px dashed var(--line); border-radius: var(--radius-lg); padding: 30px 20px; text-align: center; background: var(--sky-2); margin-top: 10px; }
  .dropzone p { margin: 2px 0; }
  .dz-ico { font-size: 2.2rem; line-height: 1; margin-bottom: 8px; }
  .dropzone .btn { display: inline-flex; }
  .readbox { text-align: center; display: grid; justify-items: center; gap: 10px; padding: 46px 22px; }
  .readbox .boot-mark { width: 52px; height: 52px; }

  /* ---------- Prototype chrome ---------- */
  .protochip { display:inline-block; background:var(--sun); color:#0B2E5C; font-weight:800; font-size:.68rem;
    letter-spacing:.09em; text-transform:uppercase; padding:3px 9px; border-radius:999px; vertical-align:middle; }
  .protobar { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:8px clamp(14px,3vw,24px); background:#0B2E5C; color:#DCE8F7; font-size:.86rem; }
  .protobar .ptext { flex:1; min-width:200px; }
  .protobar strong { color:#fff; }
  .protobar .pacts { display:flex; gap:8px; }
  .pbtn { border:1px solid #4B6A99; background:transparent; color:#fff; border-radius:999px;
    padding:5px 13px; font:600 .84rem var(--body); cursor:pointer; min-height:32px; }
  .pbtn:hover { background:#17406F; }
  .protobar + .shell .sidebar { height:auto; top:0; }

  /* ---------- Persona picker ---------- */
  .explore { background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .pgroup { font-size:1rem; margin:22px 0 10px; color:var(--muted); }
  .pgroup:first-of-type { margin-top:0; }
  .persona-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
  .persona { display:flex; gap:14px; align-items:flex-start; text-align:left; padding:16px 18px;
    border:1.5px solid var(--line); border-radius:var(--radius-lg); background:var(--paper); cursor:pointer;
    font:inherit; color:inherit; transition:border-color .15s, transform .15s; }
  .persona:hover { border-color:var(--ink-2); transform:translateY(-2px); }
  .persona .pa { flex:none; width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
    color:#fff; font-family:var(--display); font-weight:800; font-size:1rem; }
  .persona .pb { display:grid; gap:2px; min-width:0; }
  .persona strong { font-size:1.02rem; }
  .persona .prole { font-size:.82rem; font-weight:700; color:var(--ink-2); }
  .persona .pdesc { font-size:.86rem; color:var(--muted); line-height:1.35; }
  .warnlist li::before { background:var(--warn); }

  /* ---------- Sidebar persona switcher ---------- */
  .switcher { display:grid; gap:5px; margin-top:12px; }
  .switcher .small { margin-bottom:2px; }
  .swbtn { text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:7px 11px; font:500 .86rem var(--body); cursor:pointer; }
  .swbtn:hover { border-color:var(--ink-2); background:var(--sky-2); }

  @media (max-width:760px) {
    .protobar { font-size:.8rem; }
    .protobar .ptext { min-width:100%; order:2; }
    .persona-grid { grid-template-columns:1fr; }
    .site-head .head-actions { display:none; }
    .site-head { justify-content:space-between; }
    .site-head .brand { gap:8px; }
    .protochip { font-size:.6rem; padding:2px 7px; }
  }

  /* ---------- Landing page ---------- */
  .landing { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
  .site-head { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 10px clamp(16px, 4vw, 48px); background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-nav { display: flex; gap: 22px; margin-left: 18px; }
  .navlink { border: 0; background: none; padding: 6px 2px; color: var(--muted); font: 600 .95rem var(--body); cursor: pointer; }
  .navlink:hover { color: var(--ink); }
  .head-actions { margin-left: auto; display: flex; gap: 8px; }
  .hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(20px, 4vw, 56px); align-items: center; padding: clamp(28px, 6vw, 72px) clamp(20px, 5vw, 56px); background: var(--surface); }
  .hero h1 { font-family: var(--display); font-size: clamp(2rem, 4.6vw, 3.4rem); font-weight: 800; line-height: 1.08; letter-spacing: -.02em; margin: 14px 0 16px; max-width: 17ch; }
  .hero p { font-size: 1.1rem; color: var(--muted); max-width: 52ch; margin-bottom: 22px; }
  .hero-logo { width: min(420px, 100%); height: auto; justify-self: center; background: #fff; border-radius: 22px; }
  .pill { display: inline-block; padding: 5px 14px; border-radius: 999px; background: var(--sky); color: var(--ink-2); font-weight: 700; font-size: .85rem; }
  .landing-route li:last-child { padding-bottom: 0; }
  .band { scroll-margin-top: 74px; padding: clamp(30px, 5vw, 64px) clamp(20px, 5vw, 56px); }
  .band h2 { font-size: clamp(1.4rem, 2.6vw, 2rem); margin-bottom: 24px; }
  .landing-route { margin: 0; max-width: 760px; }
  .landing-route li { color: var(--ink); }
  .landing-route small { color: var(--muted); }
  .feat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .feat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; }
  .feat .dot { display: block; width: 26px; height: 26px; border-radius: 9px; margin-bottom: 12px; }
  .feat h3 { font-size: 1.05rem; margin: 0 0 6px; }
  .feat p { font-size: .94rem; color: var(--muted); margin: 0; }
  .cta { text-align: center; padding: clamp(32px, 6vw, 70px) 20px; background: var(--surface); border-top: 1px solid var(--line); }
  .cta h2 { font-size: clamp(1.5rem, 3vw, 2.2rem); }
  .cta p { color: var(--muted); margin-bottom: 20px; }
  .site-foot { padding: 24px clamp(20px, 5vw, 56px) 40px; border-top: 1px solid var(--line); }
  .site-foot p { margin: 0 0 4px; }

  /* ---------- Login dialog ---------- */
  @media (max-width: 760px) {
    .site-nav { display: none; }
    .hero { grid-template-columns: 1fr; text-align: center; }
    .hero p { margin-left: auto; margin-right: auto; }
    .hero .btn-row { justify-content: center; }
    .hero-logo { order: -1; width: min(260px, 70%); }
    .landing-route { text-align: left; }
  }
  .fine { font-size: .83rem; color: var(--muted); margin-top: 18px; }

  .wordmark { display: block; height: auto; background: #fff; border-radius: 10px; padding: 4px 6px; }
  .sidebar .wordmark { width: 190px; }
  .site-head .wordmark { width: 168px; }
  .topbar .wordmark { width: 128px; padding: 2px 4px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; }

  /* Shell */
  .shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; }
  .nav { display: grid; gap: 2px; }
  .nav button { text-align: left; border: 0; background: transparent; padding: 10px 12px 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 500; color: var(--muted); position: relative; }
  .nav button:hover { background: var(--sky-2); color: var(--ink); }
  .nav button[aria-current=page] { background: var(--sky); color: var(--ink); font-weight: 700; }
  .nav button[aria-current=page]::before { content: ""; position: absolute; left: 4px; top: 10px; bottom: 10px; width: 4px; border-radius: 4px; background: var(--sun); }
  .nav .nav-group { font-size: .8rem; color: var(--muted); padding: 14px 12px 4px; }
  .user-card { margin-top: auto; border-top: 1px solid var(--line); padding-top: 16px; font-size: .9rem; }
  .user-card strong { display: block; }
  .topbar { display: none; }
  .main { padding: clamp(20px, 4vw, 44px); max-width: 1040px; width: 100%; }
  .scrim { display: none; }

  .page-head { margin-bottom: 26px; }
  .page-head p { color: var(--muted); max-width: 62ch; margin: 0; }
  .page-head .btn-row { margin-top: 14px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; margin-bottom: 20px; }
  .panel > h2:first-child { margin-bottom: 14px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .panel-head h2 { margin: 0; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .grid-2 > .panel { margin-bottom: 0; }
  .stack > * + * { margin-top: 20px; }

  .empty { text-align: left; padding: 28px; border: 2px dashed var(--line); border-radius: var(--radius-lg); background: var(--surface); }
  .empty h2 { margin-bottom: 6px; }

  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--sky); color: var(--ink); white-space: nowrap; }
  .tag.sun { background: var(--sun-soft); color: var(--ink); }
  .tag.leaf { background: var(--leaf-soft); color: var(--leaf); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Setup checklist (a real sequence) */
  .checklist { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 8px; }
  .checklist li { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: var(--radius); background: var(--sky-2); }
  .checklist li::before { counter-increment: step; content: counter(step); width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface); border: 2px solid var(--line); }
  .checklist li.done::before { content: "✓"; background: var(--leaf); border-color: var(--leaf); color: #fff; }
  .checklist li.done span { color: var(--muted); text-decoration: line-through; }
  .checklist li .btn { margin-left: auto; }

  /* Bars */
  .bars { display: grid; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 40px; gap: 12px; align-items: center; font-size: .93rem; }
  .bar-row b { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: var(--sky-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 999px; transition: width .5s ease; }
  .bar.sun i { background: var(--sun); }
  .overall { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .overall strong { font-family: var(--display); font-size: 2.6rem; font-weight: 800; line-height: 1; }

  .task-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .task-list li { border-radius: var(--radius-sm); }
  .task-list .check { padding: 8px 6px; }
  .task-list .done-text { color: var(--muted); text-decoration: line-through; }
  .task-meta { display: block; font-size: .8rem; color: var(--muted); }

  /* Assessment */
  .progress { height: 8px; border-radius: 999px; background: var(--sky-2); overflow: hidden; margin: 6px 0 22px; }
  .progress i { display: block; height: 100%; background: var(--sun); transition: width .3s; }
  .likert { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .likert legend { font-weight: 600; margin-bottom: 10px; padding: 0; }
  .likert-scale { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .likert-scale .end { font-size: .8rem; color: var(--muted); width: 58px; }
  .likert-scale .end:last-child { text-align: right; }
  .likert-scale label { position: relative; }
  .likert-scale input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .likert-scale label span { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); font-weight: 700; background: var(--surface); cursor: pointer; }
  .likert-scale input:checked + span { background: #0551A0; border-color: #0551A0; color: #fff; }
  @media (prefers-color-scheme: dark) { .likert-scale input:checked + span { background: var(--sun); border-color: var(--sun); color: #0551A0; } }
  .likert-scale input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .skill-row { display: grid; grid-template-columns: 1fr 200px 90px; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .skill-row input[type=range] { width: 100%; accent-color: var(--ink-2); }
  .skill-row output { font-size: .85rem; color: var(--muted); }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .chip span { display: inline-block; padding: 9px 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-weight: 500; }
  .chip input:checked + span { background: var(--sky); border-color: var(--ink-2); font-weight: 700; }
  .chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Holland code — the type is the graphic */
  .code-hero { display: flex; gap: clamp(6px, 2vw, 14px); margin: 4px 0 18px; }
  .code-hero span { font-family: var(--display); font-weight: 800; font-size: clamp(3.2rem, 9vw, 5.4rem); line-height: .9; width: 1.05em; height: 1.2em; display: grid; place-items: center; border-radius: 16px; background: var(--sky); color: var(--ink); }

  .match { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 14px; display: grid; grid-template-columns: 76px 1fr; gap: 18px; }

  .fit { text-align: center; }

  .stop-marker {
    position: absolute; left: -70px; top: 0; width: 56px; height: 56px; border-radius: 50%; z-index: 1;

/* Percentile rank to the 1-5 scale the matcher uses */
function pctLevel(p) {
  if (p == null) return null;
  if (p >= 90) return 5;
  if (p >= 75) return 4;
  if (p >= 50) return 3;
  if (p >= 25) return 2;
  return 1;
}
function pctBand(p) {
  if (p == null) return null;
  if (p >= 90) return { label: 'Very high', cls: 'leaf' };
  if (p >= 75) return { label: 'High', cls: 'leaf' };
  if (p >= 50) return { label: 'Average', cls: '' };
  if (p >= 25) return { label: 'Low', cls: 'sun' };
  return { label: 'Very low', cls: 'warn' };
}
/* Work settings implied by the learner's CORE-B preferences */
function ncaeEnvironments() {
  const n = S.data.ncae;
  if (!n || !n.coreB) return [];
  const out = [];
  n.coreB.forEach(c => (CORE_B[c] || []).forEach(e => { if (out.indexOf(e) < 0) out.push(e); }));
  return out;
}
/* Aptitude level per skill, from the GSA percentile ranks */
function ncaeLevels() {
  const n = S.data.ncae;
  if (!n || !n.gsa) return {};
  const by = {};
  GSA_AREAS.forEach(a => {
    const v = n.gsa[a.id];
    if (v == null) return;
    (by[a.skill] = by[a.skill] || []).push(v);
  });
  const out = {};
  Object.keys(by).forEach(k => {
    const m = by[k].reduce((x, y) => x + y, 0) / by[k].length;
    out[k] = { pct: Math.round(m), level: pctLevel(m) };
  });
  /* Verbal reasoning speaks to speaking as well as writing */
  if (n.gsa.verbal != null && !out.speaking) out.speaking = { pct: n.gsa.verbal, level: pctLevel(n.gsa.verbal) };
  return out;
}

/* DepEd descriptors */
function gradeBand(g) {
  if (!g) return null;
  if (g >= 90) return { label: 'Outstanding', level: 5, cls: 'leaf' };
  if (g >= 85) return { label: 'Very satisfactory', level: 4, cls: 'leaf' };
  if (g >= 80) return { label: 'Satisfactory', level: 3, cls: '' };
  if (g >= 75) return { label: 'Fairly satisfactory', level: 2, cls: 'sun' };
  return { label: 'Did not meet expectations', level: 1, cls: 'warn' };
}
function subjectAvg(marks) {
  const v = (marks || []).map(Number).filter(n => n > 0);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 100) / 100 : null;
}
function gradeRows() {
  const g = S.data.grades;
  if (!g || !g.subjects) return [];
  return Object.keys(g.subjects)
    .filter(id => SUBJECT_BY_ID[id])
    .map(id => ({ id: id, name: SUBJECT_BY_ID[id].name, area: SUBJECT_BY_ID[id].area,
                  marks: g.subjects[id], avg: subjectAvg(g.subjects[id]) }))
    .sort((a, b) => (b.avg || 0) - (a.avg || 0));
}
function gradeOverall() {
  const rows = gradeRows().filter(r => r.avg);
  return rows.length ? Math.round(rows.reduce((a, r) => a + r.avg, 0) / rows.length * 100) / 100 : null;
}
/* Average grade per competency area, as a 1-5 level */
function gradeLevels() {
  const byArea = {};
  gradeRows().forEach(r => {
    if (!r.avg) return;
    (byArea[r.area] = byArea[r.area] || []).push(r.avg);
  });
  const out = {};
  Object.keys(byArea).forEach(a => {
    const m = byArea[a].reduce((x, y) => x + y, 0) / byArea[a].length;
    out[a] = { grade: Math.round(m * 100) / 100, level: gradeBand(m).level };
  });
  return out;
}
/* Report card first, self-rating second. Grades are evidence, so they weigh more. */
/* Two official documents decide a learner's competency: the report card carries the
   most weight, the NCAE aptitude scores back it up. Nothing here is self-rated. */
function effectiveSkills() {
  const g = gradeLevels();
  const n = ncaeLevels();
  const out = {};
  SKILLS.forEach(s => {
    const gv = g[s.id] ? g[s.id].level : null;
    const nv = n[s.id] ? n[s.id].level : null;
    if (gv && nv) out[s.id] = Math.round(gv * 0.6 + nv * 0.4);
    else out[s.id] = gv || nv || 3;
  });
  return out;
}
function skillSource(id) {
  if (gradeLevels()[id]) return 'card';
  if (ncaeLevels()[id]) return 'ncae';
  return 'none';
}
function topCompetencies(n) {
  const g = gradeLevels();
  return Object.keys(g)
    .map(a => ({ area: a, name: SKILL_NAME[a] || a, grade: g[a].grade, level: g[a].level }))
    .sort((x, y) => y.grade - x.grade)
    .slice(0, n || 4);
}

/* Share of yearly household income a family can realistically put toward one
   learner's schooling. Shown on screen so the learner can see the assumption. */
const EDUC_SHARE = 0.15;

function peso(n) { return '₱' + Math.round(Number(n) || 0).toLocaleString('en-PH'); }

function household() {
  const p = S.data.profile || {};
  const band = BAND_BY_ID[p.incomeBand];
  if (!band) return null;
  const monthly = band.mid + (p.ownsBusiness ? (Number(p.businessIncome) || 0) : 0);
  const yearly = monthly * 12;
  return {
    band: band, monthly: monthly, yearly: yearly,
    capacity: Math.round(yearly * EDUC_SHARE),
    cls: band.cls
  };
}

function financialFit(p) {
  const h = household();
  if (!h) return { status: 'unknown', label: 'Add your household details', cls: '' };
  const low = Number(p.costLow) || 0;
  if (low <= h.capacity) return { status: 'ok', label: 'Within your family budget', cls: 'leaf' };
  if (low <= h.capacity * 2.2) return { status: 'stretch', label: 'A stretch, plan for a scholarship', cls: 'sun' };

/* ---------- State ---------- */
const S = {
  user: null, personaKey: null, view: 'home', navOpen: false, touched: false,
  data: { profile: {}, ncae: null, roadmap: null, portfolio: [] },
  programs: [], scholarships: [],
  matchFilter: 'All', skillProgram: null, showAllSch: false,
  chat: [], chatBusy: false, upload: null, ncaeUpload: null,
  counselor: { list: null, loading: false, q: '', filter: 'all', detail: null }
};

/* ---------- Utilities ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const avg = arr => arr.length ? Math.round(arr.reduce((x, y) => x + y, 0) / arr.length) : 0;
const firstName = n => String(n || '').trim().split(/\s+/)[0] || 'there';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* PROTOTYPE: there is no server and no database. Every screen below runs on the
   fixed sample data in SAMPLE. Nothing is sent anywhere and nothing is stored. */
function deepCopy(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }
function errText(e) {
  return String((e && e.message) || e || 'Something went wrong.').replace(/^(Error|Exception):\s*/i, '');
}
function handleErr(e) { toast(errText(e), true); }
let toastTimer;
function toast(msg, isError) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, isError ? 5000 : 2200);
}

/* ---------- Domain logic ---------- */
function profileComplete() {
  const p = S.data.profile || {};
  return !!(p.grade && p.strand && p.incomeBand);
}
function getProgram(id) { return S.programs.find(p => p.id === id) || null; }
function getTarget() { return S.data.roadmap ? getProgram(S.data.roadmap.programId) : null; }

function hasKeyword(text, k) {
  if (!k) return false;
  if (k.length <= 3) return new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(text);
  return text.indexOf(k) >= 0;
}

function scoreProgram(p) {
  const pr = S.data.profile || {};
  const a = S.data.ncae;
  const reasons = [], cautions = [], strengths = [];
  const W = [0.5, 0.3, 0.2];

  let rf = 0.5;
  if (a && a.riasec) {
    rf = 0;
    p.riasec.split('').forEach((c, i) => { rf += ((a.riasec[c] || 0) / 100) * (W[i] || 0); });
    if (rf >= 0.6) reasons.push('Matches your NCAE interest code ' + a.code + ' (' + p.riasec.split('').map(c => RIASEC[c].nick).join(', ') + ')');
  }

  let sf = 0.6;
  if (pr.strand) {
    const inList = p.strands.some(s => s === pr.strand || (s === 'TVL' && pr.strand.indexOf('TVL') === 0));
    const open = p.strands.indexOf('Any') >= 0;
    sf = inList ? 1 : open ? 0.8 : 0.4;
    if (inList) reasons.push('A natural next step from ' + pr.strand);
    else if (!open) cautions.push('Usually taken by ' + p.strands.join(', ') + ' graduates. Still possible, but you may need bridging subjects.');
  }

  const gwa = Number(pr.gwa) || 0;
  let gf = 0.6;
  if (gwa && p.minGwa) {
    gf = gwa >= p.minGwa ? 1 : Math.max(0, 1 - (p.minGwa - gwa) / 10);
    if (gwa >= p.minGwa) reasons.push('Your card average of ' + gwa + ' meets the usual ' + p.minGwa + '+ benchmark');
    else cautions.push('Raise your average toward ' + p.minGwa + ' to be more competitive');
  } else if (gwa) gf = 1;

  /* Skill match. Report card grades outrank self-ratings where both exist. */
  let kf = 0.6;
  const gaps = [];
  const req = p.skills || {};
  const keys = Object.keys(req);
  const eff = effectiveSkills();
  const lvl = gradeLevels();
  const proven = [], ncaeProven = [];
  const nlv = ncaeLevels();
  if ((a || S.data.grades) && keys.length) {
    let t = 0;
    keys.forEach(k => {
      const have = Number(eff[k]) || 1;
      t += Math.min(1, have / req[k]);
      if (have < req[k]) gaps.push({ id: k, have: have, need: req[k], from: lvl[k] ? 'card' : 'self' });
      else {
        strengths.push(SKILL_NAME[k] || k);
        if (lvl[k] && lvl[k].level >= 4) proven.push((SKILL_NAME[k] || k) + ' (' + lvl[k].grade + ')');
        else if (nlv[k] && nlv[k].level >= 4) ncaeProven.push((SKILL_NAME[k] || k) + ' (' + nlv[k].pct + 'th percentile)');
      }
    });
    kf = t / keys.length;
    if (proven.length) reasons.push('Your report card backs this up: ' + proven.slice(0, 3).join(', ').toLowerCase());
    else if (ncaeProven.length) reasons.push('Your NCAE aptitude backs this up: ' + ncaeProven.slice(0, 2).join(', ').toLowerCase());
    else if (strengths.length) reasons.push('You already have: ' + strengths.slice(0, 3).join(', ').toLowerCase());
  }

  let ef = 0.5;
  const prefEnv = ncaeEnvironments();
  if (prefEnv.length) {
    const shared = p.env.filter(e => prefEnv.indexOf(e) >= 0);
    ef = shared.length ? 1 : 0.3;
    if (shared.length) reasons.push('Work setting your NCAE points to: ' + shared.join(', ').toLowerCase());
  }

  const text = ((pr.aspiration || '') + ' ' + (pr.subjects || '')).toLowerCase();
  const kw = p.keywords.some(k => hasKeyword(text, k)) ? 1 : 0;
  if (kw) reasons.push('Connects to what you said you want to become');

  let pathBoost = 0;
  if (pr.pathway && pr.pathway !== 'Not sure' && pr.pathway === p.pathway) pathBoost = 0.03;

  /* Money. A course a family cannot reach is not a good match, however well it fits. */
  const money = financialFit(p);
  const lowIncome = ['b1', 'b2'].indexOf(pr.incomeBand) >= 0;
  let mf = 0.8;
  if (money.status === 'ok') {
    mf = 1;
    reasons.push('About ' + peso(p.costLow) + ' a year at a state school or TESDA, within your family budget');
  } else if (money.status === 'stretch') {
    mf = 0.75;
    cautions.push('About ' + peso(p.costLow) + ' a year at the cheapest route. Plan for a scholarship.');
  } else if (money.status === 'need') {
    mf = 0.6;
    cautions.push('About ' + peso(p.costLow) + ' a year is above what your family can set aside on its own. Aim for a scholarship.');
  }
  /* Cost is never a reason to drop an ambition. Say how it gets paid for instead. */
  if (lowIncome && money.status !== 'ok' && p.pathway === 'College') {
    reasons.push('Tuition is free at WVSU, UP Visayas, and ISAT U, and TES can cover the rest for families like yours');
  }

  const score = clamp(Math.round(100 * (0.38 * rf + 0.17 * sf + 0.13 * gf + 0.17 * kf + 0.04 * ef + 0.04 * kw + 0.07 * mf + pathBoost)), 1, 99);
  gaps.sort((x, y) => (y.need - y.have) - (x.need - x.have));
  return { p: p, score: score, reasons: reasons, cautions: cautions, gaps: gaps, money: money };
}

function getMatches(filter) {
  let list = S.programs.map(scoreProgram).sort((a, b) => b.score - a.score);
  if (filter === 'Affordable') return list.filter(m => m.money && m.money.status === 'ok');
  if (filter && filter !== 'All') list = list.filter(m => m.p.pathway === filter);
  return list;
}

function budgetNote(p) {
  const b = (S.data.profile || {}).budget;
  if (b !== 'Free or public only' && b !== 'Low') return '';
  if (p.pathway === 'College') return 'Look for state and local universities (SUCs and LUCs), where tuition is free under RA 10931.';
  if (p.pathway === 'TVET') return 'The TESDA Training for Work Scholarship can cover training and assessment.';
  return '';
}

function roadmapTasks() {
  const r = S.data.roadmap;
  if (!r) return [];
  return r.stages.reduce((all, st) => all.concat(st.tasks.map(t => Object.assign({ stageId: st.id, stageTitle: st.title }, t))), []);
}
function roadmapPct() {
  const t = roadmapTasks();
  return t.length ? Math.round(100 * t.filter(x => x.done).length / t.length) : 0;
}

function readiness() {
  const pr = S.data.profile || {};
  const a = S.data.ncae;
  const sk = effectiveSkills();
  const has = !!(a || S.data.grades);
  const n = v => v ? Math.round((Number(v) - 1) / 4 * 100) : 0;
  const gwa = Number(pr.gwa) || 0;
  const academic = gwa ? clamp(Math.round((gwa - 65) / 30 * 100), 0, 100) : 0;
  const digital = has ? avg([n(sk.digital), n(sk.coding)]) : 0;
  const communication = has ? avg([n(sk.writing), n(sk.speaking)]) : 0;
  const problem = has ? avg([n(sk.problem), n(sk.math), n(sk.science)]) : 0;
  const career = Math.min(100,
    (profileComplete() ? 15 : 0) + (a ? 15 : 0) + (S.data.grades ? 10 : 0) + (S.data.roadmap ? 20 : 0) +
    Math.round(roadmapPct() * 0.25) + Math.min((S.data.portfolio || []).length, 5) * 3);
  return { academic, digital, communication, problem, career, overall: avg([academic, digital, communication, problem, career]) };
}

const INCOME_RANK = { below250: 1, '250to400': 2, above400: 3 };
function scholarshipStatus(s) {
  const pr = S.data.profile || {};
  const t = getTarget();
  const ok = [], chk = [], no = [];

  if (s.pathway !== 'Any' && t) {
    if (t.pathway === s.pathway) ok.push('Covers ' + PATHWAY_LABEL[s.pathway].toLowerCase() + ', your target pathway');
    else no.push('For ' + PATHWAY_LABEL[s.pathway].toLowerCase() + '; your target is ' + PATHWAY_LABEL[t.pathway].toLowerCase());
  }
  if (s.minGwa) {
    const g = Number(pr.gwa);
    if (!g) chk.push('Usually needs a GWA of about ' + s.minGwa + '+. Add your GWA to your profile.');
    else if (g >= s.minGwa) ok.push('Your GWA (' + g + ') meets the usual ' + s.minGwa + '+');
    else no.push('Usually needs a GWA of about ' + s.minGwa + '+ (yours is ' + g + ')');
  }
  if (s.strands.indexOf('Any') < 0) {
    if (!pr.strand) chk.push('Mainly for ' + s.strands.join(', ') + ' learners');
    else if (s.strands.indexOf(pr.strand) >= 0) ok.push('Open to ' + pr.strand + ' learners');
    else chk.push('Mainly for ' + s.strands.join(', ') + ' learners; others may qualify in special cases');
  }
  if (s.fields.indexOf('Any') < 0) {
    if (!t) chk.push('For programs in: ' + s.fields.join(', '));
    else if (s.fields.indexOf(t.field) >= 0) ok.push('Supports ' + t.field.toLowerCase() + ' programs like ' + t.name);
    else no.push('Supports ' + s.fields.join(', ').toLowerCase() + ' programs only');
  }
  if (s.income === 'low' || s.income === 'mid') {
    const rank = INCOME_RANK[pr.income];
    const limit = s.income === 'low' ? 1 : 2;
    if (!rank) chk.push('Has a family income limit. Confirm with your parents or guardian.');
    else if (rank <= limit) ok.push('Your family income range fits');
    else no.push('Has a family income limit below your range');
  }
  if (s.special === 'ofw') { if (pr.ofw) ok.push('For OFW dependents'); else no.push('Only for dependents of OFWs'); }
  if (s.special === 'gsis') { if (pr.gsis) ok.push('For children of GSIS members'); else no.push('Only for children of GSIS members'); }
  if (s.special === '4ps') { if (pr.fourps) ok.push('4Ps or Listahanan households get priority'); else chk.push('Priority goes to 4Ps or Listahanan households'); }

  const status = no.length ? 'no' : chk.length ? 'check' : 'likely';
  return { s: s, status: status, ok: ok, chk: chk, no: no };
}
function scholarshipList() { return S.scholarships.map(scholarshipStatus); }

function computeSummary() {
  const pr = S.data.profile || {};
  const a = S.data.ncae;
  const rd = readiness();
  const t = getTarget();
  const top = a ? getMatches()[0] : null;
  const flags = [];
  if (!a) flags.push('No NCAE result');
  if (!t) flags.push('No target');
  if (rd.overall < 50) flags.push('Low readiness');
  if (Number(pr.gwa) && Number(pr.gwa) < 80) flags.push('Academic support');
  if (pr.grade === '12' && t && roadmapPct() < 25) flags.push('Roadmap behind');
  return {
    grade: pr.grade || '', strand: pr.strand || '', gwa: Number(pr.gwa) || null, code: a ? a.code : '',
    topMatch: top ? { id: top.p.id, name: top.p.name, field: top.p.field, score: top.score } : null,
    target: t ? { id: t.id, name: t.name, field: t.field, pathway: t.pathway } : null,
    readiness: rd, roadmapPct: roadmapPct(), portfolioCount: (S.data.portfolio || []).length,
    scholarships: scholarshipList().filter(x => x.status === 'likely').length,
    flags: flags, updatedAt: new Date().toISOString()
  };
}

/* Roadmap generation */
function buildRoadmap(p) {
  const pr = S.data.profile || {};
  const m = scoreProgram(p);
  const gaps = m.gaps.length ? m.gaps : Object.keys(p.skills).map(k => ({ id: k }));
  const gapTask = i => gaps[i] ? 'Strengthen ' + (SKILL_NAME[gaps[i].id] || gaps[i].id).toLowerCase() + ': ' + SKILL_TIPS[gaps[i].id] : null;
  const sch = scholarshipList()
    .filter(x => x.status !== 'no' && (x.s.pathway === p.pathway || x.s.pathway === 'Any'))
    .slice(0, 3).map(x => x.s.name);
  const proj = p.projects;
  const isCollege = p.pathway === 'College';

  const after = {
    College: ['Confirm your enrollment, scholarship, and housing or travel plans', 'Join an org related to ' + p.field.toLowerCase() + ' in your first semester'],
    TVET: ['Enroll in the training program and take the TESDA competency assessment', 'Apply for jobs or apprenticeships using your NC and portfolio'],
    Employment: ['Apply to at least 5 employers and track each application', 'Keep learning through free online courses while working'],
    Entrepreneurship: ['Register your business name with DTI and set up simple records', 'Attend a free training at a DTI Negosyo Center']
  }[p.pathway] || [];

  const stages = [
    { id: 'g11s1', label: 'G11', title: 'Grade 11, 1st semester', focus: 'Explore and build strong study habits', tasks: [
      'Upload your NCAE Certificate of Rating and report card to NextStep',
      'Talk to your guidance counselor about ' + p.name,
      gapTask(0),
      'Join a club or organization related to ' + p.field.toLowerCase()
    ] },
    { id: 'g11s2', label: 'G11', title: 'Grade 11, 2nd semester', focus: 'Grow your skills and start your portfolio', tasks: [
      gapTask(1),
      proj[0] ? 'Start a portfolio project: ' + proj[0] : null,
      'Research 3 schools or providers for ' + p.name + '. Start with: ' + p.where,
      p.minGwa ? 'Keep your GWA at ' + p.minGwa + ' or higher' : 'Keep your grades steady'
    ] },
    { id: 'g12s1', label: 'G12', title: 'Grade 12, 1st semester', focus: 'Prepare applications and requirements', tasks: [
      isCollege ? 'Review for entrance tests. Notes: ' + p.prep : 'Prepare for requirements. Notes: ' + p.prep,
      sch.length ? 'Prepare documents for: ' + sch.join(', ') : 'Look for scholarships that fit your target',
      proj[1] ? 'Do a second portfolio project: ' + proj[1] : gapTask(2),
      'Ask for a work immersion placement related to ' + p.field.toLowerCase()
    ] },
    { id: 'g12s2', label: 'G12', title: 'Grade 12, 2nd semester', focus: 'Apply, finish strong, and decide', tasks: [
      isCollege ? 'Submit applications to your chosen colleges' : 'Submit applications or enroll in your chosen program',
      'Apply to scholarships before their deadlines',
      'Finish work immersion and add it to your portfolio',
      'Build your CV in the NextStep portfolio and practice an interview with the AI coach'
    ] },
    { id: 'after', label: 'Next', title: 'After graduation', focus: PATHWAY_LABEL[p.pathway] + ' track', tasks: after }
  ];

  return {
    programId: p.id, createdAt: new Date().toISOString(),
    stages: stages.map(st => ({
      id: st.id, label: st.label, title: st.title, focus: st.focus,
      tasks: st.tasks.filter(Boolean).map((text, i) => ({
        id: st.id + '-' + i, text: text,
        done: st.id === 'g11s1' && i === 0 && !!S.data.ncae
      }))
    })),
    catchUp: pr.grade === '12'
  };
}

function scoreBars(rd) {

function taskItem(t, showStage) {
  return `<li><label class="check">
    <input type="checkbox" data-task="${esc(t.id)}" ${t.done ? 'checked' : ''}>
    <span><span class="${t.done ? 'done-text' : ''}">${esc(t.text)}</span>${showStage ? `<span class="task-meta">${esc(t.stageTitle)}</span>` : ''}</span>
  </label></li>`;
}
function emptyState(title, text, btnLabel, view) {
  return `<div class="empty"><h2>${title}</h2><p class="muted">${text}</p>${btnLabel ? `<button class="btn primary" data-act="go" data-view="${view}">${btnLabel}</button>` : ''}</div>`;

/* ---------- Home ---------- */
function viewHome() {
  const pr = S.data.profile || {};
  const a = S.data.ncae;
  const r = S.data.roadmap;
  const rd = readiness();
  const setup = [
    { done: profileComplete(), label: 'Complete your profile', view: 'profile', btn: 'Open profile' },
    { done: !!S.data.grades, label: 'Upload your report card', view: 'grades', btn: 'Enter grades' },
    { done: !!a, label: 'Upload your NCAE result', view: 'ncae', btn: 'Upload' },
    { done: !!r, label: 'Choose a target program and get your roadmap', view: 'matches', btn: 'See matches' }
  ];
  const setupDone = setup.every(s => s.done);
  const next = roadmapTasks().filter(t => !t.done).slice(0, 4);
  const top = a ? getMatches().slice(0, 3) : [];
  const t = getTarget();
  const sub = pr.grade ? `Grade ${esc(pr.grade)}${pr.strand ? ', ' + esc(pr.strand) : ''}${t ? '. Target: ' + esc(t.name) : ''}` : 'Let\'s set up your roadmap. It takes about 15 minutes.';

  return `
  <header class="page-head"><h1>Hi, ${esc(firstName(S.user.name))}</h1><p>${sub}</p></header>
  ${setupDone ? '' : `
  <section class="panel">
    <h2>Get started</h2>
    <ol class="checklist">
      ${setup.map(s => `<li class="${s.done ? 'done' : ''}"><span>${s.label}</span>${s.done ? '' : `<button class="btn small" data-act="go" data-view="${s.view}">${s.btn}</button>`}</li>`).join('')}
    </ol>
  </section>`}
  <div class="grid-2">
    <section class="panel">
      <h2>Career readiness scorecard</h2>
      <div class="overall"><strong>${rd.overall}</strong><span class="muted">out of 100 overall</span></div>
      ${scoreBars(rd)}
      <p class="small muted" style="margin-top:14px">Scores grow as you upload a newer report card, rate your skills, check off roadmap steps, and add portfolio items.</p>
      ${(() => { const h = household(); return h ? `<p class="small muted">Household: <strong>${esc(h.cls)}</strong>, about ${peso(h.capacity)} a year available for schooling.</p>` : ''; })()}
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Next steps</h2>${r ? `<button class="btn small ghost" data-act="go" data-view="roadmap">Full roadmap</button>` : ''}</div>
      ${r ? (next.length ? `<ul class="task-list">${next.map(x => taskItem(x, true)).join('')}</ul>` : '<p>You finished every step on your roadmap. Add new goals on the roadmap page.</p>')
          : '<p class="muted">Your next steps appear here after you choose a target program.</p>'}
    </section>
  </div>
  ${top.length ? `
  <section class="panel" style="margin-top:20px">
    <div class="panel-head"><h2>Your top matches</h2><button class="btn small ghost" data-act="go" data-view="matches">See all</button></div>
    <div class="bars">${top.map(m => `
      <div class="bar-row"><span>${esc(m.p.name)}</span><div class="bar sun"><i style="width:${m.score}%"></i></div><b>${m.score}%</b></div>`).join('')}
    </div>
  </section>` : ''}`;
}

function ncaeWhy() {
  return `<section class="panel">
    <h2>Why the NCAE and not our own quiz</h2>
    <div class="grid-2" style="margin-top:6px">
      <div><h3>It is already yours</h3><p class="muted small">Every Grade 10 learner in the country sits the NCAE. NextStep reads the result you already have instead of asking you to answer another long questionnaire.</p></div>

    <p class="small muted" style="margin-top:10px"><strong>In this prototype</strong> no photo is uploaded, sent, or read. Choosing a file shows a sample Certificate of Rating.</p>

}

/* ---------- Matches ---------- */

    emptyState('Nothing to match on yet', 'Upload your report card or your NCAE result, and your matches appear here.', 'Enter my grades', 'grades');
  const list = getMatches(S.matchFilter);
  const target = getTarget();
  return `
  <header class="page-head"><h1>Course & career matches</h1>
    <p>Ranked on your report card grades, strand, ${S.data.ncae ? 'NCAE interests (' + esc(S.data.ncae.code) + '), ' : ''}plans, and what your family can afford. Pick one as your target to build your roadmap.</p></header>
  ${!S.data.ncae ? '<p class="notice">These matches use your grades and profile only. Upload your NCAE result to factor in your measured interests and aptitude.</p>' : ''}

  <div class="filter-row" role="group" aria-label="Filter by pathway">

    <div class="fit"><strong>${m.score}%</strong><small>fit</small><div class="bar sun"><i style="width:${m.score}%"></i></div></div>
    <div>
      <div class="tags" style="margin-bottom:6px"><span class="tag">${esc(PATHWAY_LABEL[p.pathway] || p.pathway)}</span><span class="tag">${esc(p.field)}</span>${m.money && m.money.status !== 'unknown' ? `<span class="tag ${m.money.cls}">${esc(m.money.label)}</span>` : ''}${isT ? '<span class="tag sun">Your target</span>' : ''}</div>
      <h3>${esc(p.name)}</h3>
      <p class="small muted" style="margin:0">Leads to: ${esc(p.careers.join(', '))}</p>

}

/* ---------- Roadmap ---------- */
function viewRoadmap() {
  const r = S.data.roadmap;
  const t = getTarget();
  if (!r || !t) return `<header class="page-head"><h1>My roadmap</h1></header>` +
    emptyState('Choose a target first', 'Pick a program or pathway from your matches and NextStep will build a semester-by-semester plan for you.', 'See my matches', 'matches');
  const pct = roadmapPct();
  const grade = (S.data.profile || {}).grade;
  const currentIdx = r.stages.findIndex(st => st.tasks.some(x => !x.done));
  return `
  <section class="route-head">
    <div>
      <span class="tag sun">${esc(PATHWAY_LABEL[t.pathway] || t.pathway)}</span>
      <h1>${esc(t.name)}</h1>
      <p>Your route from Grade 11 to your next step.${grade === '12' ? ' You are in Grade 12, so review the Grade 11 steps and catch up on anything you missed.' : ''}</p>
      <div class="btn-row" style="margin-top:14px"><button class="btn small" data-act="go" data-view="matches">Change target</button></div>
    </div>
    <div class="route-meter"><strong>${pct}%</strong><small>of steps done</small></div>
  </section>
  <div class="trail">
    ${r.stages.map((st, i) => {
      const done = st.tasks.length && st.tasks.every(x => x.done);
      const cls = done ? 'done' : i === currentIdx ? 'current' : '';
      const count = st.tasks.filter(x => x.done).length;
      return `
      <section class="stop ${cls}">
        <div class="stop-marker" aria-hidden="true">${done ? '✓' : esc(st.label)}</div>
        <div class="stop-card">
          <header><h2>${esc(st.title)}</h2><span class="small muted">${count} of ${st.tasks.length} done</span></header>
          <p class="focus">${esc(st.focus)}</p>
          <ul class="task-list">${st.tasks.map(x => `
            <li><label class="check">
              <input type="checkbox" data-task="${esc(x.id)}" ${x.done ? 'checked' : ''}>
              <span class="${x.done ? 'done-text' : ''}">${esc(x.text)}</span>
              ${x.custom ? `<button type="button" class="task-del" data-act="delTask" data-id="${esc(x.id)}" aria-label="Remove this step">✕</button>` : ''}
            </label></li>`).join('')}
          </ul>
          <form class="add-task" data-form="addTask" data-stage="${esc(st.id)}">
            <label class="sr-only" for="add-${esc(st.id)}">Add your own step</label>
            <input id="add-${esc(st.id)}" name="text" type="text" placeholder="Add your own step" maxlength="200">
            <button class="btn small" type="submit">Add</button>
          </form>
        </div>
      </section>`;
    }).join('')}
    <div class="destination">
      <div class="sign" aria-hidden="true"><span>★</span></div>
      <div><span class="small muted">Destination</span><h2>${esc(t.careers[0] || t.name)}</h2></div>
    </div>
  </div>`;
}

/* ---------- Scholarships ---------- */
function viewScholarships() {
  const list = scholarshipList();
  const likely = list.filter(x => x.status === 'likely');
  const check = list.filter(x => x.status === 'check');
  const no = list.filter(x => x.status === 'no');
  const t = getTarget();
  return `
  <header class="page-head"><h1>Scholarships</h1>
    <p>Matched to your profile${t ? ' and your target, ' + esc(t.name) : ''}. Add your GWA, family income range, and eligibility details in your profile for better matches.</p></header>
  <p class="notice">Requirements, slots, and schedules change every year. Always confirm on the official website or with your guidance counselor before applying.</p>
  <h2 class="group-title">Likely a good fit (${likely.length})</h2>
  ${likely.map(schCard).join('') || '<p class="muted">None yet. Complete your profile to see which scholarships fit you.</p>'}
  <h2 class="group-title">Check the requirements (${check.length})</h2>
  ${check.map(schCard).join('') || '<p class="muted">Nothing to check right now.</p>'}
  <h2 class="group-title">Not a match right now (${no.length})</h2>
  ${S.showAllSch ? no.map(schCard).join('') : (no.length ? '<button class="btn small" data-act="showAllSch">Show them and why</button>' : '')}`;

function schCard(x) {
  const s = x.s;
  const tag = { likely: '<span class="tag leaf">Likely fit</span>', check: '<span class="tag sun">Check</span>', no: '<span class="tag warn">Not now</span>' }[x.status];
  return `
  <article class="sch">
    <header><div><h3>${esc(s.name)}</h3><p class="provider">${esc(s.provider)}</p></div>${tag}</header>
    <p style="margin:0">${esc(s.coverage)}</p>
    <ul>${x.ok.map(r => `<li class="ok">${esc(r)}</li>`).join('')}${x.chk.map(r => `<li class="chk">${esc(r)}</li>`).join('')}${x.no.map(r => `<li class="no">${esc(r)}</li>`).join('')}</ul>
    <p class="small muted" style="margin:0">${esc(s.timing)}${s.notes ? ' ' + esc(s.notes) : ''}</p>
    ${s.link ? `<p style="margin:10px 0 0"><a href="${esc(s.link)}" target="_blank" rel="noopener">Visit the official website</a></p>` : ''}
  </article>`;
}

/* ---------- Skills gap ---------- */
function viewSkills() {
  const a = S.data.ncae;
  if (!a && !S.data.grades) return `<header class="page-head"><h1>Skills gap analyzer</h1></header>` +
    emptyState('Nothing to compare yet', 'Upload your report card or your NCAE result, and NextStep can show the gaps.', 'Enter my grades', 'grades');
  if (!S.programs.length) return `<header class="page-head"><h1>Skills gap analyzer</h1></header><p class="muted">No sample programs loaded.</p>`;
  const defaultId = S.skillProgram || (getTarget() && getTarget().id) || getMatches()[0].p.id;
  const p = getProgram(defaultId) || S.programs[0];
  const req = p.skills;
  const eff = effectiveSkills(); const lv = gradeLevels();
  const nl = ncaeLevels();
  const rows = Object.keys(req).map(k => ({ id: k, have: Number(eff[k]) || 1, need: req[k], from: lv[k] ? 'card' : (nl[k] ? 'ncae' : 'none') }))
    .sort((x, y) => (y.need - y.have) - (x.need - x.have));
  const gapCount = rows.filter(r => r.have < r.need).length;
  return `
  <header class="page-head"><h1>Skills gap analyzer</h1><p>Compare your current skills with what a program or career usually expects.</p></header>
  <section class="panel">
    <label class="field"><span>Program or pathway</span>
      <select data-act-change="skillProgram">${S.programs.map(x => `<option value="${esc(x.id)}" ${x.id === p.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
    </label>
    <p>${gapCount ? `You have <strong>${gapCount}</strong> skill${gapCount > 1 ? 's' : ''} to build for ${esc(p.name)}.` : `Your skills already meet what ${esc(p.name)} usually expects. Keep them sharp.`}</p>
    ${rows.map(r => `
      <div class="gap-row">
        <div class="gap-head"><strong>${esc(SKILL_NAME[r.id] || r.id)}${r.from === 'card' ? ' <span class="tag leaf">from your card</span>' : (r.from === 'ncae' ? ' <span class="tag">from your NCAE</span>' : '')}</strong>${r.have >= r.need ? '<span class="tag leaf">Ready</span>' : `<span class="tag warn">Build ${r.need - r.have} level${r.need - r.have > 1 ? 's' : ''}</span>`}</div>
        <div class="dual"><span>You</span><div class="bar"><i style="width:${r.have * 20}%"></i></div><span>${r.have}</span></div>
        <div class="dual need"><span>Needed</span><div class="bar"><i style="width:${r.need * 20}%"></i></div><span>${r.need}</span></div>
        ${r.have < r.need ? `<p class="tip">${esc(SKILL_TIPS[r.id] || '')}</p>` : ''}
      </div>`).join('')}
    <p class="small muted" style="margin-top:14px">Areas marked <span class="tag leaf">from your card</span> come from your report card grades, and <span class="tag">from your NCAE</span> from your NCAE aptitude scores. Nothing here is self-rated.</p>
  </section>`;
}

/* ---------- Coach ---------- */
function coachContext() {
  const pr = S.data.profile || {};
  const a = S.data.ncae;
  const t = getTarget();
  const lines = [
    'Name: ' + firstName(S.user.name),
    'Grade: ' + (pr.grade || 'unknown') + '; Strand: ' + (pr.strand || 'unknown') + '; GWA: ' + (pr.gwa || 'unknown'),
    'Plan after SHS: ' + (pr.pathway || 'not sure') + '; Budget: ' + (pr.budget || 'unknown'),
    'Wants to become: ' + (pr.aspiration || 'not stated'),
    'Strong subjects: ' + (pr.subjects || 'not stated')
  ];
  if (S.data.grades) {
    lines.push('Report card average: ' + gradeOverall());
    lines.push('Strongest subjects by competency: ' + topCompetencies(4).map(c => c.name + ' ' + c.grade).join(', '));
  }
  const hh = household();
  if (hh) lines.push('Household: ' + hh.cls + ', about ' + peso(hh.capacity) + ' a year available for schooling.');
  if (a) {
    lines.push('NCAE CORE-A interest code: ' + a.code);
    lines.push('NCAE recommended track: ' + a.track);
    lines.push('NCAE aptitude percentiles: ' + GSA_AREAS.map(x => (x.short || x.name) + ' ' + (a.gsa[x.id] == null ? '?' : a.gsa[x.id])).join(', '));
    lines.push('Top matches: ' + getMatches().slice(0, 5).map(m => m.p.name + ' (' + m.score + '%)').join(', '));
  }
  if (t) {
    const m = scoreProgram(t);
    lines.push('Target: ' + t.name + ' (' + t.pathway + '). Prep: ' + t.prep);
    lines.push('Skills to build for target: ' + (m.gaps.map(g => SKILL_NAME[g.id]).join(', ') || 'none'));
    lines.push('Roadmap progress: ' + roadmapPct() + '%. Next steps: ' + roadmapTasks().filter(x => !x.done).slice(0, 3).map(x => x.text).join(' | '));
  }
  const sch = scholarshipList().filter(x => x.status !== 'no').map(x => x.s.name);
  if (sch.length) lines.push('Scholarships that may fit: ' + sch.join(', '));
  return lines.join('\n');
}
function viewCoach() {

  <section class="chat">

    </div>
    ${S.chat.length ? '' : `<div class="chat-suggest">${suggestions.map(s => `<button data-act="ask" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}
    <form class="chat-form" data-form="chat">
      <label class="sr-only" for="chat-input">Message</label>

function offlineCoach(q) {
  const t = q.toLowerCase();
  const a = S.data.ncae;
  const target = getTarget();
  if (/(suicid|kill myself|self.?harm|hurt myself|abuse|walang kwenta|ayoko na|want to die)/.test(t)) {
    return 'I\'m really glad you told me. What you\'re feeling matters. Please talk to someone you trust today, like your guidance counselor, a teacher, or a family member. You can also call the NCMH Crisis Hotline at 1553 any time. You don\'t have to handle this alone.';
  }
  if (/(stress|pressure|anxious|worried|kabado|confused|lost|undecided)/.test(t)) {
    return 'Feeling unsure is normal in SHS. Try this: 1) Upload your NCAE result and report card if you have not yet. 2) Pick your top 2 matches and read their details. 3) Talk to your guidance counselor or someone working in that field. You don\'t need to be 100% sure. You just need a good next step.';
  }
  if (/(scholar|iskolar|financial|tuition|allowance|pera|afford)/.test(t)) {
    const list = scholarshipList();
    const likely = list.filter(x => x.status === 'likely').map(x => x.s.name);
    const check = list.filter(x => x.status === 'check').map(x => x.s.name);
    if (!likely.length && !check.length) return 'Add your GWA, family income range, and eligibility details to your profile, then open the Scholarships page to see what fits you.';
    return (likely.length ? 'Scholarships that look like a good fit: ' + likely.join(', ') + '. ' : '') +
      (check.length ? 'Worth checking: ' + check.join(', ') + '. ' : '') +
      'Start gathering your report card, birth certificate, and proof of income early, and confirm each deadline on the official website.';
  }
  if (/(interview)/.test(t)) {
    return 'Interview tips: 1) Prepare a 1-minute introduction: who you are, your strand, and why you want this program. 2) Prepare 2 stories: a time you solved a problem and a time you worked in a team. 3) Research the school or company. 4) Practice out loud with a friend. 5) Prepare one question to ask them at the end.';
  }
  if (/(study|aral|exam|test|review|upcat|entrance|grade)/.test(t)) {
    return 'Study plan: set 45-minute focus blocks with 10-minute breaks, review Math and English daily since most entrance tests cover them, and answer past or sample tests under time limits.' +
      (target ? ' For ' + target.name + ': ' + target.prep + '.' : '') + ' Ask your teachers for reviewers early in Grade 12.';
  }
  if (/(skill|improve|weak|better at)/.test(t)) {
    if (!a && !S.data.grades) return 'Upload your report card or NCAE result first so I know your strengths.';
    const p = target || getMatches()[0].p;
    const gaps = scoreProgram(p).gaps.slice(0, 2);
    if (!gaps.length) return 'Your skills already meet what ' + p.name + ' usually expects. Build depth with a portfolio project: ' + (p.projects[0] || 'a project in your field') + '.';
    return 'For ' + p.name + ', focus on: ' + gaps.map(g => SKILL_NAME[g.id] + '. ' + SKILL_TIPS[g.id]).join(' ');
  }
  if (/(course|program|kurso|college|career|trabaho|job|fit|become|what should)/.test(t)) {
    if (!a && !S.data.grades) return 'Upload your report card or NCAE result first. Then I can show which programs fit your strengths, strand, and plans.';
    const top = getMatches().slice(0, 3);
    return 'Your strongest matches right now: ' + top.map(m => m.p.name + ' (' + m.score + '% fit)').join(', ') +
      '. Open Course & career matches to see why, then set one as your target to get a roadmap.';
  }
  if (target) {
    const next = roadmapTasks().filter(x => !x.done).slice(0, 3);
    return 'Your target is ' + target.name + '. ' + (next.length ? 'Your next steps: ' + next.map(x => x.text).join(' | ') : 'You finished your roadmap steps. Add new goals on the roadmap page.');
  }
  return 'I can help with course choices, scholarships, skills to build, study plans, and interview practice. Try asking one of those, or finish your profile and assessment for personal advice.';
}

function needsSupport(sum) {
  if (!sum) return true;
  return sum.flags.some(f => ['Low readiness', 'Academic support', 'Roadmap behind', 'No assessment'].indexOf(f) >= 0);
}
function viewCounselor() {
  const c = S.counselor;
  if (!c.list) return `<header class="page-head"><h1>Learner dashboard</h1></header><p class="muted">Loading learners…</p>`;
  const all = c.list;
  const withSum = all.filter(u => u.summary);
  const assessed = withSum.filter(u => u.summary.code).length;
  const targeted = withSum.filter(u => u.summary.target).length;
  const support = all.filter(u => needsSupport(u.summary)).length;
  const avgReady = avg(withSum.map(u => u.summary.readiness.overall));

  const fields = {};
  all.forEach(u => {
    const s = u.summary;
    const f = s && s.target ? s.target.field : s && s.topMatch ? s.topMatch.field + ' (not chosen)' : 'Not started';
    fields[f] = (fields[f] || 0) + 1;
  });
  const fieldRows = Object.entries(fields).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxF = Math.max(1, ...fieldRows.map(r => r[1]));

  const q = c.q.toLowerCase();
  const rows = all.filter(u => {
    const s = u.summary;
    if (q && (u.name + ' ' + u.email + ' ' + u.school).toLowerCase().indexOf(q) < 0) return false;
    switch (c.filter) {
      case 'support': return needsSupport(s);
      case 'noassess': return !s || !s.code;
      case 'notarget': return !s || !s.target;
      case 'g11': return s && s.grade === '11';
      case 'g12': return s && s.grade === '12';
      default: return true;
    }
  }).sort((a, b) => ((a.summary && a.summary.readiness.overall) || 0) - ((b.summary && b.summary.readiness.overall) || 0));

  return `
  <header class="page-head"><h1>Learner dashboard</h1><p>See career goals, preparation gaps, and learners who may need support. Sorted by lowest readiness first.</p>
    <div class="btn-row"><button class="btn small" data-act="refreshCounselor">Refresh</button></div></header>
  <div class="stats">
    <div class="stat"><strong>${all.length}</strong><span>learners</span></div>
    <div class="stat"><strong>${all.length ? Math.round(100 * assessed / all.length) : 0}%</strong><span>took the assessment</span></div>
    <div class="stat"><strong>${all.length ? Math.round(100 * targeted / all.length) : 0}%</strong><span>chose a target</span></div>
    <div class="stat"><strong>${avgReady}</strong><span>average readiness</span></div>
    <div class="stat"><strong>${support}</strong><span>may need support</span></div>
  </div>
  <section class="panel"><h2>Career goals by field</h2>
    ${fieldRows.length ? `<div class="bars">${fieldRows.map(([f, n]) => `<div class="bar-row"><span>${esc(f)}</span><div class="bar"><i style="width:${Math.round(100 * n / maxF)}%"></i></div><b>${n}</b></div>`).join('')}</div>` : '<p class="muted">No learners yet. Share the web app link with your learners.</p>'}
  </section>
  <section class="panel">
    <div class="toolbar">
      <label class="sr-only" for="c-search">Search learners</label>
      <input id="c-search" type="search" placeholder="Search by name, email, or school" value="${esc(c.q)}" data-act-input="counselorSearch">
      <label class="sr-only" for="c-filter">Filter</label>
      <select id="c-filter" data-act-change="counselorFilter">
        ${[['all', 'All learners'], ['support', 'May need support'], ['noassess', 'No assessment yet'], ['notarget', 'No target yet'], ['g11', 'Grade 11'], ['g12', 'Grade 12']]
          .map(([v, l]) => `<option value="${v}" ${c.filter === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Learner</th><th>Grade and strand</th><th>Target or top match</th><th>Readiness</th><th>Roadmap</th><th>Flags</th></tr></thead>
      <tbody>${rows.map(u => {

        return `<tr data-act="openStudent" data-id="${esc(u.id)}" tabindex="0">

          <td>${s ? s.readiness.overall : 0}</td>

  portfolio: f => {
    const title = f.title.value.trim();
    const link = f.link.value.trim();
    const msg = f.querySelector('.form-msg');
    if (!title) { msg.textContent = 'Add a title for this item.'; return; }
    if (link && !/^https?:\/\//i.test(link)) { msg.textContent = 'Links must start with http:// or https://'; return; }
    if ((S.data.portfolio || []).length >= 60) { msg.textContent = 'Your portfolio is full (60 items). Remove an older item first.'; return; }
    S.data.portfolio = (S.data.portfolio || []).concat([{
      id: uid(), type: f.type.value, title: title, org: f.org.value.trim(), date: f.date.value,
      desc: f.desc.value.trim(), link: link, createdAt: new Date().toISOString()
    }]);
    saveKey('portfolio', true); render();
  }
};

/* PROTOTYPE: no AI service is called. Replies come from offlineCoach(), a fixed
   set of sample answers built from this learner's own sample data. */
function sendChat(text) {
  if (S.chatBusy) return;
  S.chat.push({ role: 'user', text: text });
  S.chatBusy = true;
  render();
  setTimeout(() => {
    S.chat.push({ role: 'assistant', text: offlineCoach(text) });
    S.chatBusy = false;
    render();
    const input = $('#chat-input'); if (input) input.focus();
  }, 450);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) ACTIONS.openStudent(e.target, e);
  if (e.key === 'Escape' && S.counselor.detail) { S.counselor.detail = null; render(); }
  if (e.key === 'Escape' && S.navOpen) { S.navOpen = false; render(); }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.dataset.form) return;
  e.preventDefault();
  const fn = SUBMITS[f.dataset.form];
  if (fn) fn(f);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.task) {
    const r = S.data.roadmap;
    if (!r) return;
    const id = el.dataset.task;
    r.stages.forEach(st => st.tasks.forEach(t => { if (t.id === id) t.done = el.checked; }));
    saveRoadmapSoon();
    render();
    const again = document.querySelector('[data-task="' + id + '"]');
    if (again) again.focus({ preventScroll: true });
  }
  if (el.dataset.actChange === 'ncaeFile') {
    const f = el.files && el.files[0];
    if (!f) return;
    /* PROTOTYPE: the file is never read, uploaded, or stored. Only its name is shown. */
    const up = S.ncaeUpload;
    up.state = 'reading'; up.fileName = f.name; el.value = '';
    render();
    setTimeout(() => {
      const base = ncaeSample((S.data.profile || {}).strand || '');
      up.result = JSON.parse(JSON.stringify(base));
      up.state = 'review';
      render(); window.scrollTo(0, 0);
    }, 1600);
  }
  if (el.dataset.actChange === 'uploadPeriod') { S.upload.period = Number(el.dataset.i); }
  if (el.dataset.actChange === 'uploadFile') {
    const f = el.files && el.files[0];
    if (!f) return;
    /* PROTOTYPE: the file is never read, uploaded, or stored. Only its name is shown. */
    const up = S.upload;
    up.state = 'reading';
    up.fileName = f.name;
    el.value = '';
    render();
    setTimeout(() => {
      const strand = (S.data.profile || {}).strand || '';
      const sample = cardSample(strand);
      const only = up.period;
      up.rows = Object.keys(sample).filter(id => SUBJECT_BY_ID[id]).map(id => {
        const full = sample[id];
        const marks = only < 0 ? full.slice() : GRADE_PERIODS.map((_, i) => (i === only ? full[i] : null));
        return { id: id, name: SUBJECT_BY_ID[id].name, marks: marks, avg: subjectAvg(marks) };
      }).sort((a, b) => (b.avg || 0) - (a.avg || 0));
      up.periodLabel = only < 0 ? 'All three grading periods' : GRADE_PERIODS[only];
      up.state = 'review';
      render();
      window.scrollTo(0, 0);
    }, 1600);
  }
  if (el.dataset.actChange === 'skillProgram') { S.skillProgram = el.value; render(); }
  if (el.dataset.actChange === 'counselorFilter') { S.counselor.filter = el.value; render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.actInput === 'counselorSearch') {
    S.counselor.q = el.value;
    const pos = el.selectionStart;
    render();
    const again = $('#c-search'); if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  }
});

/* ---------- Start ---------- */
S.programs = SAMPLE.programs;
S.scholarships = SAMPLE.scholarships;
render();

/* Cache the prototype so it opens with no internet (useful when presenting). */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
